version: '3.8'
services:
  leader:
    build: ./service
    environment:
      - ROLE=leader
      - PORT=8000
      - FOLLOWER_COUNT=5
      - WRITE_QUORUM=3
      - MIN_DELAY_MS=0
      - MAX_DELAY_MS=1000
      - FOLLOWER_BASE_URL=http://follower
    ports:
      - "8000:8000"
    depends_on:
      - follower1
      - follower2
      - follower3
      - follower4
      - follower5

  follower1:
    build: ./service
    environment:
      - ROLE=follower
      - PORT=8001
      - FOLLOWER_ID=1
    ports:
      - "8001:8001"

  follower2:
    build: ./service
    environment:
      - ROLE=follower
      - PORT=8002
      - FOLLOWER_ID=2
    ports:
      - "8002:8002"

  follower3:
    build: ./service
    environment:
      - ROLE=follower
      - PORT=8003
      - FOLLOWER_ID=3
    ports:
      - "8003:8003"

  follower4:
    build: ./service
    environment:
      - ROLE=follower
      - PORT=8004
      - FOLLOWER_ID=4
    ports:
      - "8004:8004"

  follower5:
    build: ./service
    environment:
      - ROLE=follower
      - PORT=8005
      - FOLLOWER_ID=5
    ports:
      - "8005:8005"
